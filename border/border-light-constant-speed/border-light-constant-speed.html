<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Light Constant Speed</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 60px;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            background: #0a0a12;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        .card-wrap {
            position: relative;
            width: 300px;
        }

        .card-wrap .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 50px 40px;
            background-color:#12121c;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-wrap .border-light {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .card-wrap .border-light rect {
            fill: none;
            stroke: #ff7000;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 20 80;
            filter: drop-shadow(0 0 4px #ff7000) drop-shadow(0 0 15px #ff6f0075);
        }

        @keyframes run {
            to {
                stroke-dashoffset: -100;
            }
        }

        .card-wrap .border-light.part-1 {
            animation: runBorderLine1 6s linear infinite;
        }

        @keyframes runBorderLine1 {
            to {
                stroke-dashoffset: -100;
            }
        }

        .card-wrap .border-light.part-2 {
            stroke-dashoffset:-50;
            animation: runBorderLine2 6s linear infinite;
        }

        @keyframes runBorderLine2 {
            from {
                stroke-dashoffset:-50;
            }
            to {
                stroke-dashoffset:-150;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card-wrap .border-light rect {
                animation: none;
            }
        }

    </style>

</head>
<body>

    <div class="card-wrap">
        <svg class="border-light part-1">
            <rect x="0" y="0" width="100%" height="100%" rx="20" ry="20" pathLength="100" />
        </svg>
        <div class="card">
            The light beam passes through the corner and along the edge at the same speed.
        </div>
    </div>

    <div class="card-wrap">
        <svg class="border-light part-1">
            <rect x="0" y="0" width="100%" height="100%" rx="20" ry="20" pathLength="100" />
        </svg>
        <svg class="border-light part-2">
            <rect x="0" y="0" width="100%" height="100%" rx="20" ry="20" pathLength="100" />
        </svg>
        <div class="card">
            The light beam passes through the corner and along the edge at the same speed.
        </div>
    </div>

</body>
</html>
